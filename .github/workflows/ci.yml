name: Continuous Integration & SonarCloud Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ main ]

jobs:
  build:
    name: Build, Test & SonarCloud Analysis (Java 25)
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Cache SonarCloud Packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Validate Code Formatting (Spotless)
        run: ./mvnw --batch-mode spotless:check

      - name: Run Python Automation Unit Tests
        run: python3 -m unittest discover -s tests/scripts

      - name: Full Reactor Clean Build & Verification
        run: ./mvnw --batch-mode clean verify

      - name: Enforce JaCoCo Coverage Quality Gates
        run: ./scripts/parse_jacoco.py --threshold 95.0 --fail-under-gates

      - name: SonarCloud Analysis & Quality Gate Check
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw --batch-mode sonar:sonar -Dsonar.qualitygate.wait=true

      - name: Upload JaCoCo Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: target/site/jacoco/
