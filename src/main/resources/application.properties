# Quarkus Application & Picocli Configuration
quarkus.application.name=dev-agent
quarkus.application.version=1.0.0-SNAPSHOT
quarkus.banner.enabled=false

# Opt-In Per-Session Logging (Build-time ALL retains DEBUG/TRACE in AOT native; runtime OFF until opted in)
quarkus.log.min-level=ALL
quarkus.log.level=OFF
quarkus.log.console.enabled=false
quarkus.log.console.stderr=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.file.enabled=false

# Arc CDI Bean Preservation for Picocli Subcommands
quarkus.arc.unremovable-types=guru.thomasweber.devagent.cli.**

# Embedded H2 Relational Database
quarkus.datasource.db-kind=h2
quarkus.datasource.devservices.enabled=false
quarkus.datasource.jdbc.url=jdbc:h2:file:${user.home}/.config/dev-agent/data/agent;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;LOCK_TIMEOUT=5000
quarkus.datasource.jdbc.max-size=8
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false

# Dev Profile Configuration (Persist data across CLI executions)
%dev.quarkus.datasource.devservices.enabled=false
%dev.quarkus.hibernate-orm.schema-management.strategy=update

# Hermetic Test Profile Configuration (In-Memory Isolation)
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:dev_agent_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# Deterministic Caffeine Cache for Architectural Verdicts
quarkus.cache.caffeine."architect-verdicts".maximum-size=500
quarkus.cache.caffeine."architect-verdicts".expire-after-write=1h
